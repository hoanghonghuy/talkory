name: synapse-sdd
description: Synapse SDD workflow — proposal, specs delta, design, tasks
artifacts:
  - id: proposal
    generates: proposal.md
    requires: []
  - id: specs
    generates: specs/
    requires: [proposal]
  - id: design
    generates: design.md
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    requires: [design, specs]
workflow: sdd
