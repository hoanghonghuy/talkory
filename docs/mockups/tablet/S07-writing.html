<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-tablet-preview="768" />
  <title>Talkory — Luyện viết (S07 tablet)</title>
  <!-- Borrow: Skritter grid concept + Spotify CJK | Reject: sidebar -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-on-primary: #ffffff;
      --color-success: #00a35c;
      --color-canvas: #ffffff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-muted: #bbb8b1;
      --color-focus-canvas: #fafaf9;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06);
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-cjk: Inter, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, "Noto Sans", system-ui, sans-serif;
      background: var(--color-focus-canvas);
      color: var(--color-charcoal);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .writing-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .exit-btn {
      width: 36px; height: 36px;
      border: none; background: transparent;
      border-radius: 999px; cursor: pointer;
      color: var(--color-slate);
      display: grid; place-items: center;
    }

    .exit-btn:hover { background: var(--color-surface); }

    .char-title {
      font-family: var(--font-cjk);
      font-size: 28px;
      font-weight: 500;
    }

    .char-meta { font-size: 13px; color: var(--color-slate); margin-top: 2px; }

    .header-actions { display: flex; gap: 8px; }

    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-hairline);
      background: var(--color-canvas);
      color: var(--color-slate);
      cursor: pointer;
    }

    .btn:hover { background: var(--color-surface); }

    .btn-primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
      border-color: transparent;
    }

    .writing-body {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    .side-panel { display: flex; flex-direction: column; gap: 16px; }

    .panel-card {
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-card);
    }

    .panel-card h3 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-muted);
      margin-bottom: 12px;
    }

    .stroke-demo {
      aspect-ratio: 1;
      background: var(--color-surface);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      font-family: var(--font-cjk);
      font-size: 120px;
      color: var(--color-charcoal);
      position: relative;
      overflow: hidden;
    }

    .stroke-demo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(var(--color-hairline) 1px, transparent 1px),
        linear-gradient(90deg, var(--color-hairline) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
      opacity: 0.5;
      pointer-events: none;
    }

    .stroke-controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .stroke-controls button { flex: 1; }

    .radical-list { font-size: 14px; line-height: 1.6; color: var(--color-slate); }
    .radical-list strong { color: var(--color-charcoal); font-family: var(--font-cjk); }

    .canvas-area { display: flex; flex-direction: column; gap: 16px; }

    .practice-canvas {
      aspect-ratio: 4/3;
      max-height: 420px;
      background: var(--color-canvas);
      border: 2px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      position: relative;
      box-shadow: var(--shadow-card);
      cursor: crosshair;
    }

    .practice-canvas::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px dashed var(--color-hairline);
      border-radius: var(--radius-md);
      pointer-events: none;
    }

    .practice-canvas::after {
      content: "学";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--font-cjk);
      font-size: 200px;
      color: rgba(187, 184, 177, 0.35);
      pointer-events: none;
    }

    .canvas-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--color-muted);
      background: var(--color-canvas);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--color-hairline);
    }

    .typing-box {
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .typing-box label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .typing-row { display: flex; gap: 10px; }

    .typing-row input {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 15px;
      padding: 10px 12px;
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
    }

    .free-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-success);
      background: #c3f0d2;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .mockup-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-size: 11px;
      color: var(--color-slate);
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: var(--shadow-card);
    }
  </style>
</head>
<body>
  <header class="writing-header">
    <div class="header-left">
      <a href="S03-dashboard.html" class="exit-btn" aria-label="Thoát">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </a>
      <div>
        <div class="char-title">学</div>
        <div class="char-meta">がく · học · JLPT N5 · 8 nét</div>
      </div>
      <span class="free-badge">Luôn miễn phí</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn">Xóa canvas</button>
      <button type="button" class="btn btn-primary">Lưu lần luyện</button>
    </div>
  </header>

  <div class="writing-body">
    <aside class="side-panel">
      <div class="panel-card">
        <h3>Thứ tự nét</h3>
        <div class="stroke-demo">学</div>
        <div class="stroke-controls">
          <button type="button" class="btn">◀</button>
          <button type="button" class="btn btn-primary">▶ Phát</button>
          <button type="button" class="btn">Nét 3/8</button>
        </div>
      </div>
      <div class="panel-card">
        <h3>Bộ thủ</h3>
        <p class="radical-list">
          <strong>子</strong> (tử) — con<br />
          Nghĩa gốc liên quan đến “học hỏi từ nhỏ”.
        </p>
      </div>
    </aside>

    <div class="canvas-area">
      <div class="practice-canvas" role="img" aria-label="Vùng luyện viết">
        <span class="canvas-hint">Vẽ bằng chuột hoặc cảm ứng</span>
      </div>
      <div class="typing-box">
        <label for="romaji">Luyện gõ (romaji)</label>
        <div class="typing-row">
          <input id="romaji" type="text" placeholder="gaku" value="ga" />
          <button type="button" class="btn btn-primary">Kiểm tra</button>
        </div>
      </div>
    </div>
  </div>

  <div class="mockup-badge">S07 · Writing · Tablet · /writing/学</div>
</body>
</html>
