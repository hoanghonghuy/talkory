<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talkory — Trang chủ mới (S03 empty)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-on-primary: #fff;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-muted: #bbb8b1;
      --color-lang-ja: #e6e0f5;
      --color-lang-ja-accent: #7b3ff2;
      --color-lang-zh: #dcecfa;
      --color-lang-zh-accent: #2a9d99;
      --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --sidebar-w: 200px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--color-surface); color: var(--color-charcoal); min-height: 100vh; }
    .shell { display: flex; min-height: 100vh; }
    .sidebar {
      position: fixed; left: 0; top: 0; width: var(--sidebar-w); height: 100vh;
      background: var(--color-surface); border-right: 1px solid var(--color-hairline); padding: 24px 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 20px 28px; }
    .brand-mark { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-primary); color: #fff; font-weight: 700; display: grid; place-items: center; }
    .brand h1 { font-size: 16px; font-weight: 600; color: var(--color-primary); }
    .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 0 8px; border-radius: var(--radius-md); text-decoration: none; font-size: 14px; color: var(--color-slate); }
    .nav a.active { background: rgba(86,69,212,0.08); color: var(--color-primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--color-primary); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
    .main-wrap { margin-left: var(--sidebar-w); flex: 1; padding: 48px 32px; max-width: 720px; }
    .empty {
      text-align: center;
      padding: 48px 24px;
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
    }
    .mascots { display: flex; justify-content: center; gap: 16px; margin-bottom: 24px; }
    .mascots img { width: 80px; height: 80px; object-fit: contain; }
    .empty h2 { font-size: 26px; font-weight: 600; margin-bottom: 10px; }
    .empty > p { font-size: 16px; color: var(--color-slate); line-height: 1.55; margin-bottom: 28px; max-width: 420px; margin-left: auto; margin-right: auto; }
    .lang-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 400px; margin: 0 auto 20px; }
    .lang-card {
      padding: 20px 16px;
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s;
    }
    .lang-card:hover { border-color: var(--color-primary); }
    .lang-card.ja { background: var(--color-lang-ja); border-color: transparent; }
    .lang-card.zh { background: var(--color-lang-zh); border-color: transparent; }
    .lang-card strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .lang-card.ja strong { color: var(--color-lang-ja-accent); }
    .lang-card.zh strong { color: var(--color-lang-zh-accent); }
    .lang-card span { font-size: 13px; color: var(--color-slate); }
    .btn-primary {
      display: inline-block;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-on-primary);
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .skip { display: block; margin-top: 16px; font-size: 14px; color: var(--color-slate); }
    .mockup-badge { position: fixed; bottom: 16px; right: 16px; font-size: 11px; color: var(--color-slate); background: #fff; border: 1px solid var(--color-hairline); padding: 6px 12px; border-radius: 999px; }
  
    /* —— AppShell nav (shared) —— */
    .sidebar { display: flex; flex-direction: column; }
    .nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .nav a,
    .nav-settings {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-size: 14px;
      color: var(--color-slate);
      transition: background 0.15s;
    }
    .nav a:hover,
    .nav-settings:hover { background: var(--color-canvas); }
    .nav a.active,

    .nav svg,
    .nav-settings svg { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.85; }


  </style>
</head>

  </div>
