<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talkory — Cài đặt guest (S11)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-on-primary: #fff;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-lang-ja: #e6e0f5;
      --radius-md: 8px;
      --radius-lg: 12px;
      --sidebar-w: 200px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--color-surface); color: var(--color-charcoal); min-height: 100vh; }
    .shell { display: flex; min-height: 100vh; }
    .sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-w); height: 100vh; background: var(--color-surface); border-right: 1px solid var(--color-hairline); padding: 24px 0; }
    .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 20px; font-size: 14px; color: var(--color-slate); text-decoration: none; }
    .nav a.active { color: var(--color-primary); font-weight: 600; }
    .main-wrap { margin-left: var(--sidebar-w); flex: 1; padding: 32px; max-width: 520px; }
    h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .guest-banner {
      background: var(--color-lang-ja); border-radius: var(--radius-lg);
      padding: 20px; margin-bottom: 24px;
    }
    .guest-banner h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .guest-banner p { font-size: 14px; color: var(--color-slate); margin-bottom: 14px; line-height: 1.45; }
    .btn-cta {
      display: inline-block; font-family: inherit; font-size: 14px; font-weight: 600;
      padding: 10px 18px; background: var(--color-primary); color: var(--color-on-primary);
      border-radius: var(--radius-md); text-decoration: none; border: none; cursor: pointer;
    }
    .section { margin-bottom: 24px; }
    .section h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-slate); margin-bottom: 12px; }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0; border-bottom: 1px solid var(--color-hairline);
      font-size: 15px;
    }
    .row select {
      font-family: inherit; font-size: 14px; padding: 6px 10px;
      border: 1px solid var(--color-hairline); border-radius: var(--radius-md);
      background: var(--color-canvas);
    }
    .mockup-badge { position: fixed; bottom: 16px; right: 16px; font-size: 11px; color: var(--color-slate); background: #fff; border: 1px solid var(--color-hairline); padding: 6px 12px; border-radius: 999px; }
  
    /* —— AppShell nav (shared) —— */
    .sidebar { display: flex; flex-direction: column; }
    .nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .nav a,
    .nav-settings {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-size: 14px;
      color: var(--color-slate);
      transition: background 0.15s;
    }
    .nav a:hover,
    .nav-settings:hover { background: var(--color-canvas); }
    .nav a.active,

    .nav svg,
    .nav-settings svg { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.85; }


  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <nav class="nav">
        <a href="S03-dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
          Trang chủ
        </a>
        <a href="S04-curriculum.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Học
        </a>
        <a href="S06-srs-front.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Ôn tập
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="S11-settings-guest.html" class="nav-settings active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          Cài đặt
        </a>
      </div>
      </aside>
    <div class="main-wrap">
      <h2>Cài đặt</h2>
      <div class="guest-banner">
        <h3>Bạn đang dùng chế độ khách</h3>
        <p>Tiến độ lưu trên thiết bị này. Đăng ký để đồng bộ streak, SRS và học trên nhiều máy.</p>
        <a href="S01-auth-register.html" class="btn-cta">Đăng ký miễn phí</a>
      </div>
      <div class="section">
        <h3>Hiển thị</h3>
        <div class="row">
          <span>Ngôn ngữ giao diện</span>
          <select><option>Tiếng Việt</option><option>English</option></select>
        </div>
        <div class="row">
          <span>Chủ đề</span>
          <select><option>Talkory Classic</option></select>
        </div>
      </div>
      <p style="font-size:13px;color:var(--color-slate)">Tài khoản, thông báo và Premium chỉ có sau khi đăng ký.</p>
    </div>
  </div>
  <div class="mockup-badge">S11 · guest settings · Tablet</div>
</body>
</html>
