<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talkory Admin — IT modules (S12)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-lang-it: #ffe8d4;
      --color-lang-it-accent: #dd5b00;
      --color-success-soft: #c3f0d2;
      --color-success: #00a35c;
      --color-card-yellow: #fef7d6;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --radius-md: 8px;
      --radius-lg: 12px;
      --admin-sidebar: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--color-surface); color: var(--color-charcoal); min-height: 100vh; }
    .admin-sidebar { position: fixed; width: var(--admin-sidebar); height: 100vh; background: var(--color-charcoal); padding: 20px 0; }
    .admin-brand { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; }
    .admin-brand strong { display: block; font-size: 14px; color: #fff; }
    .admin-nav a { display: block; padding: 8px 20px; font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: none; }
    .admin-nav a.active { background: rgba(86,69,212,0.35); color: #fff; }
    .admin-main { margin-left: var(--admin-sidebar); padding: 28px; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .head h1 { font-size: 20px; font-weight: 600; }
    .btn { font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-md); border: none; cursor: pointer; background: var(--color-primary); color: #fff; }
    table { width: 100%; border-collapse: collapse; background: var(--color-canvas); border: 1px solid var(--color-hairline); border-radius: var(--radius-lg); overflow: hidden; }
    th, td { text-align: left; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--color-hairline); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-slate); background: var(--color-surface); }
    .tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .tag-pub { background: var(--color-success-soft); color: var(--color-success); }
    .tag-draft { background: var(--color-card-yellow); color: #92680a; }
    .slug { font-family: ui-monospace, monospace; font-size: 12px; color: var(--color-slate); }
    .mockup-badge { position: fixed; bottom: 16px; right: 16px; font-size: 11px; background: #fff; border: 1px solid var(--color-hairline); padding: 6px 12px; border-radius: 999px; color: var(--color-slate); }
  </style>
</head>
<body>
  <aside class="admin-sidebar">
    <div class="admin-brand"><strong>Talkory Admin</strong></div>
    <nav class="admin-nav">
      <a href="S12-admin-curriculum.html">Curriculum</a>
      <a href="S12-admin.html">Lessons</a>
      <a href="S12-admin-it.html" class="active">IT modules</a>
      <a href="S12-admin-import.html">Import</a>
      <a href="S12-admin-ai-drafts.html">AI drafts</a>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="head">
      <h1>IT Track modules</h1>
      <button type="button" class="btn">+ Module mới</button>
    </div>
    <table>
      <thead>
        <tr><th>Tên</th><th>Slug</th><th>Bài</th><th>Trạng thái</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>💻 Dev Vocabulary</td>
          <td class="slug">dev-vocabulary</td>
          <td>8</td>
          <td><span class="tag tag-pub">published</span></td>
        </tr>
        <tr>
          <td>🤝 Meeting Japanese</td>
          <td class="slug">meeting-ja</td>
          <td>6</td>
          <td><span class="tag tag-pub">published</span></td>
        </tr>
        <tr>
          <td>📄 Tech Docs (ZH)</td>
          <td class="slug">tech-docs-zh</td>
          <td>5</td>
          <td><span class="tag tag-draft">draft</span></td>
        </tr>
      </tbody>
    </table>
  </main>
  <div class="mockup-badge">S12 · /admin/it · Tablet</div>
</body>
</html>
