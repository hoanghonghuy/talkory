<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talkory Admin — Curriculum (S12)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-success: #00a35c;
      --color-success-soft: #c3f0d2;
      --color-warning: #dd5b00;
      --color-card-yellow: #fef7d6;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-muted: #bbb8b1;
      --color-lang-ja: #e6e0f5;
      --radius-md: 8px;
      --radius-lg: 12px;
      --admin-sidebar: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--color-surface); color: var(--color-charcoal); min-height: 100vh; }
    .admin-shell { display: flex; min-height: 100vh; }
    .admin-sidebar {
      position: fixed; width: var(--admin-sidebar); height: 100vh;
      background: var(--color-charcoal); color: #e8e6e3; padding: 20px 0;
    }
    .admin-brand { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; }
    .admin-brand strong { display: block; font-size: 14px; color: #fff; }
    .admin-brand span { font-size: 11px; color: rgba(255,255,255,0.5); }
    .admin-nav a { display: block; padding: 8px 20px; font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: none; }
    .admin-nav a.active { background: rgba(86,69,212,0.35); color: #fff; }
    .admin-main { margin-left: var(--admin-sidebar); flex: 1; }
    .admin-topbar { padding: 14px 28px; background: var(--color-canvas); border-bottom: 1px solid var(--color-hairline); display: flex; justify-content: space-between; align-items: center; }
    .admin-topbar h1 { font-size: 18px; font-weight: 600; }
    .btn { font-family: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: var(--radius-md); border: 1px solid var(--color-hairline); background: var(--color-canvas); cursor: pointer; }
    .btn-primary { background: var(--color-primary); color: #fff; border-color: transparent; }
    .content { padding: 24px 28px; }
    .tree { background: var(--color-canvas); border: 1px solid var(--color-hairline); border-radius: var(--radius-lg); overflow: hidden; }
    .tree-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-bottom: 1px solid var(--color-hairline);
      font-size: 14px; cursor: grab;
    }
    .tree-row:last-child { border-bottom: none; }
    .tree-row.level { background: var(--color-surface); font-weight: 600; }
    .tree-row.unit { padding-left: 32px; }
    .tree-row.lesson { padding-left: 48px; color: var(--color-slate); }
    .drag { color: var(--color-muted); }
    .tag { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px; margin-left: auto; }
    .tag-pub { background: var(--color-success-soft); color: var(--color-success); }
    .tag-draft { background: var(--color-card-yellow); color: #92680a; }
    .mockup-badge { position: fixed; bottom: 16px; right: 16px; font-size: 11px; background: #fff; border: 1px solid var(--color-hairline); padding: 6px 12px; border-radius: 999px; color: var(--color-slate); }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand"><strong>Talkory Admin</strong><span>CMS</span></div>
      <nav class="admin-nav">
        <a href="S12-admin-curriculum.html" class="active">Curriculum</a>
        <a href="S12-admin.html">Lessons</a>
        <a href="S12-admin-it.html">IT modules</a>
        <a href="S12-admin-import.html">Import</a>
        <a href="S12-admin-ai-drafts.html">AI drafts</a>
      </nav>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <h1>Curriculum tree · Tiếng Nhật</h1>
        <div><button type="button" class="btn">+ Level</button> <button type="button" class="btn btn-primary">Lưu thứ tự</button></div>
      </header>
      <div class="content">
        <div class="tree">
          <div class="tree-row level"><span class="drag">⋮⋮</span> JLPT N5 <span class="tag tag-pub">published</span></div>
          <div class="tree-row unit"><span class="drag">⋮⋮</span> Unit 1 — Chào hỏi</div>
          <div class="tree-row lesson"><span class="drag">⋮⋮</span> Bài 1 — Chào hỏi cơ bản <span class="tag tag-pub">pub</span></div>
          <div class="tree-row lesson"><span class="drag">⋮⋮</span> Bài 2 — Hiragana あ行 <span class="tag tag-pub">pub</span></div>
          <div class="tree-row lesson"><span class="drag">⋮⋮</span> Bài 3 — Hiragana か行 <span class="tag tag-draft">draft</span></div>
          <div class="tree-row level"><span class="drag">⋮⋮</span> JLPT N4 <span class="tag tag-draft">draft</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="mockup-badge">S12 · /admin/curriculum · Desktop</div>
</body>
</html>
