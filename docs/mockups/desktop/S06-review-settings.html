<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talkory — Cài đặt ôn tập (S06)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-lang-it-accent: #dd5b00;
      --radius-md: 8px;
      --radius-lg: 12px;
      --sidebar-w: 240px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--color-surface); color: var(--color-charcoal); min-height: 100vh; }
    .shell { display: flex; min-height: 100vh; }
    .sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-w); height: 100vh; background: var(--color-surface); border-right: 1px solid var(--color-hairline); padding: 24px 0; }
    .brand { padding: 0 20px 28px; font-size: 16px; font-weight: 600; color: var(--color-primary); }
    .main-wrap { margin-left: var(--sidebar-w); flex: 1; padding: 32px; max-width: 560px; }
    .back { font-size: 14px; color: var(--color-slate); text-decoration: none; display: inline-block; margin-bottom: 20px; }
    .back:hover { color: var(--color-primary); }
    h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .sub { font-size: 14px; color: var(--color-slate); margin-bottom: 24px; }
    .option-list { display: flex; flex-direction: column; gap: 8px; }
    .option {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; background: var(--color-canvas);
      border: 1px solid var(--color-hairline); border-radius: var(--radius-lg);
      cursor: pointer;
    }
    .option.selected { border-color: var(--color-primary); background: rgba(86,69,212,0.04); }
    .radio { width: 18px; height: 18px; border: 2px solid var(--color-hairline); border-radius: 999px; flex-shrink: 0; }
    .option.selected .radio { border-color: var(--color-primary); box-shadow: inset 0 0 0 4px var(--color-primary); }
    .option-body strong { display: block; font-size: 15px; margin-bottom: 2px; }
    .option-body span { font-size: 13px; color: var(--color-slate); }
    .count { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--color-primary); }
    .btn-save {
      margin-top: 24px; width: 100%; font-family: inherit;
      font-size: 15px; font-weight: 600; padding: 12px;
      background: var(--color-primary); color: #fff;
      border: none; border-radius: var(--radius-md); cursor: pointer;
    }
    .mockup-badge { position: fixed; bottom: 16px; right: 16px; font-size: 11px; color: var(--color-slate); background: #fff; border: 1px solid var(--color-hairline); padding: 6px 12px; border-radius: 999px; }
  
    /* —— AppShell nav (shared) —— */
    .sidebar { display: flex; flex-direction: column; }
    .nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
    .nav a,
    .nav-settings {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-size: 14px;
      color: var(--color-slate);
      transition: background 0.15s;
    }
    .nav a:hover,
    .nav-settings:hover { background: var(--color-canvas); }
    .nav a.active,

    .nav svg,
    .nav-settings svg { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.85; }


      .brand { display: flex; align-items: center; gap: 12px; padding: 0 20px 28px; }
    .brand-mark { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-primary); color: #fff; font-weight: 700; font-size: 18px; display: grid; place-items: center; }
    .brand h1 { font-size: 16px; font-weight: 600; color: var(--color-primary); }
    .brand p { font-size: 12px; color: var(--color-slate); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div>
          <h1>Talkory</h1>
          <p>Học Nhật &amp; Trung</p>
        </div>
      </div>
      <nav class="nav">
        <a href="S03-dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
          Trang chủ
        </a>
        <a href="S04-curriculum.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Học
        </a>
        <a href="S06-srs-front.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Ôn tập
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="S11-settings.html" class="nav-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          Cài đặt
        </a>
      </div>
      </aside>
    <div class="main-wrap">
      <a href="S06-srs-front.html" class="back">← Quay lại ôn tập</a>
      <h2>Lọc deck</h2>
      <p class="sub">Chọn nguồn thẻ khi ôn SRS</p>
      <div class="option-list">
        <div class="option selected">
          <div class="radio"></div>
          <div class="option-body"><strong>Tất cả</strong><span>Curriculum + IT Track</span></div>
          <span class="count">24 due</span>
        </div>
        <div class="option">
          <div class="radio"></div>
          <div class="option-body"><strong>Curriculum</strong><span>JLPT &amp; HSK từ bài học</span></div>
          <span class="count">20 due</span>
        </div>
        <div class="option">
          <div class="radio"></div>
          <div class="option-body"><strong>IT Track</strong><span>Từ vựng công nghệ</span></div>
          <span class="count" style="color:var(--color-lang-it-accent)">4 due</span>
        </div>
      </div>
      <button type="button" class="btn-save">Áp dụng &amp; bắt đầu ôn</button>
    </div>
  </div>
  <div class="mockup-badge">S06 · /review/settings · Desktop</div>
</body>
</html>
