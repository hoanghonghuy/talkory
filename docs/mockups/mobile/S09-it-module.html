    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .head p { font-size: 13px; color: var(--color-slate); line-height: 1.45; }
    .lesson {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; background: var(--color-canvas);
      border: 1px solid var(--color-hairline); border-radius: var(--radius-lg);
      margin-bottom: 8px; text-decoration: none; color: inherit;
    }
    .lesson.next { border-color: rgba(221,91,0,0.35); background: rgba(255,232,212,0.35); }
    .num { width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--color-surface); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
    .lesson strong { display: block; font-size: 14px; }
    .lesson small { font-size: 11px; color: var(--color-slate); }
    .tag { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--color-lang-it-accent); }
    .check { width: 22px; height: 22px; border-radius: 999px; background: var(--color-success-soft); color: var(--color-success); display: grid; place-items: center; font-size: 11px; margin-left: auto; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: var(--color-canvas); border-top: 1px solid var(--color-hairline);
      padding: 6px 4px calc(6px + var(--safe-b));
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--color-slate); text-decoration: none; }
    .bottom-nav a.active { color: var(--color-primary); font-weight: 600; }
    .bottom-nav svg { width: 22px; height: 22px; }
    .mock { position: fixed; bottom: calc(var(--nav-h) + 6px); right: 6px; font-size: 9px; padding: 3px 6px; background: #fff; border: 1px solid var(--color-hairline); border-radius: 999px; color: var(--color-slate); }
