<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Talkory — Luyện viết (S07 mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4; --color-canvas: #fff; --color-surface: #f6f5f4;
      --color-hairline: #e5e3df; --color-charcoal: #37352f; --color-slate: #5d5b54;
      --color-muted: #bbb8b1; --color-lang-ja: #e6e0f5; --color-lang-ja-accent: #7b3ff2;
      --color-lang-zh-accent: #2a9d99; --radius-md: 8px; --radius-lg: 12px;
      --safe-b: env(safe-area-inset-bottom, 0px); --nav-h: 64px;
      --font-cjk: Inter, "Hiragino Sans", "Noto Sans JP", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif; background: var(--color-surface);
      color: var(--color-charcoal); min-height: 100dvh;
      padding: 12px 16px calc(var(--nav-h) + var(--safe-b) + 16px);
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--color-slate); margin-bottom: 16px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .filter-btn {
      font: inherit; font-size: 12px; font-weight: 500; padding: 7px 12px;
      border: 1px solid var(--color-hairline); border-radius: 999px;
      background: var(--color-canvas); color: var(--color-slate);
    }
    .filter-btn.on { background: var(--color-lang-ja); color: var(--color-lang-ja-accent); font-weight: 600; border-color: transparent; }
    .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-muted); margin: 12px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cell {
      aspect-ratio: 1; background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md); display: grid; place-items: center;
      font-family: var(--font-cjk); font-size: 26px; text-decoration: none; color: inherit;
    }
    .cell.done { background: rgba(0,237,100,0.08); border-color: #c3f0d2; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: var(--color-canvas); border-top: 1px solid var(--color-hairline);
      padding: 6px 4px calc(6px + var(--safe-b));
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; color: var(--color-slate); text-decoration: none;
    }
    .bottom-nav a.active { color: var(--color-primary); font-weight: 600; }
    .bottom-nav svg { width: 22px; height: 22px; }
    .mock { position: fixed; bottom: calc(var(--nav-h) + 6px); right: 6px; font-size: 9px; padding: 3px 6px; background: #fff; border: 1px solid var(--color-hairline); border-radius: 999px; color: var(--color-slate); }
  </style>
</head>

  </div>
