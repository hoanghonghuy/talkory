<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Talkory — Placement (S02 mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-muted: #bbb8b1;
      --color-lang-ja: #e6e0f5;
      --color-lang-ja-accent: #7b3ff2;
      --color-lang-zh: #dcecfa;
      --color-lang-zh-accent: #2a9d99;
      --color-focus-canvas: #fafaf9;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --font-cjk: Inter, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--color-focus-canvas);
      color: var(--color-charcoal);
      min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top)) 16px calc(20px + var(--safe-b));
    }
    .top { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .skip { font-size: 13px; color: var(--color-slate); text-decoration: none; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; line-height: 1.25; }
    .lead { font-size: 15px; color: var(--color-slate); line-height: 1.5; margin-bottom: 24px; }
    .lang-card {
      display: flex; gap: 14px; align-items: center;
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-xl);
      padding: 16px; margin-bottom: 12px;
      text-decoration: none; color: inherit;
    }
    .lang-card img { height: 64px; flex-shrink: 0; }
    .lang-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .lang-card p { font-size: 13px; color: var(--color-slate); line-height: 1.4; }
    .tag {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px; margin-bottom: 6px;
    }
    .lang-card.ja .tag { background: var(--color-lang-ja); color: var(--color-lang-ja-accent); }
    .lang-card.zh .tag { background: var(--color-lang-zh); color: var(--color-lang-zh-accent); }
    .badge { position: fixed; bottom: 10px; right: 10px; font-size: 10px; padding: 4px 8px; background: #fff; border: 1px solid var(--color-hairline); border-radius: 999px; color: var(--color-slate); }

    /* question state */
    .focus-header {
      position: sticky; top: 0; z-index: 10;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
      margin: -12px -16px 20px;
      padding: 12px 16px;
    }
    .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-slate); margin-bottom: 6px; }
    .progress-bar { height: 5px; background: var(--color-hairline); border-radius: 999px; overflow: hidden; }
    .progress-bar i { display: block; height: 100%; width: 35%; background: var(--color-lang-ja-accent); }
    .coach { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .coach img { height: 48px; }
    .coach p { font-size: 13px; color: var(--color-slate); line-height: 1.4; }
    .q-card {
      background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg); padding: 18px; margin-bottom: 20px;
    }
    .q-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; line-height: 1.4; }
    .prompt {
      font-family: var(--font-cjk); font-size: 22px; text-align: center;
      padding: 16px; background: var(--color-surface); border-radius: var(--radius-md);
      margin-bottom: 14px;
    }
    .opt {
      width: 100%; text-align: left; font: inherit; font-size: 15px;
      padding: 14px; margin-bottom: 8px;
      border: 1px solid var(--color-hairline); border-radius: var(--radius-md);
      background: var(--color-canvas);
    }
    .opt.on { border-color: var(--color-lang-ja-accent); background: rgba(123,63,242,0.08); }
    .btn-next {
      width: 100%; font: inherit; font-size: 16px; font-weight: 600;
      padding: 14px; border: none; border-radius: var(--radius-md);
      background: var(--color-primary); color: #fff;
      text-decoration: none; display: block; text-align: center;
    }
  </style>
</head>
<body>
  <!-- Picker: comment out question block when previewing picker only -->
  <div class="top"><a href="S03-dashboard.html" class="skip">Bỏ qua → N5/HSK1</a></div>
  <h1>Chọn ngôn ngữ kiểm tra</h1>
  <p class="lead">15–20 câu để gợi ý level phù hợp.</p>
  <a href="S02-placement-question.html" class="lang-card ja">
    <img src="../../assets/mascots/sakko-idle-transparent.png" alt="" />
    <div><span class="tag">JLPT</span><h2>Tiếng Nhật</h2><p>~18 câu · 8–12 phút</p></div>
  </a>
  <a href="#" class="lang-card zh">
    <img src="../../assets/mascots/longmi-idle-transparent.png" alt="" />
    <div><span class="tag">HSK</span><h2>Tiếng Trung</h2><p>~20 câu · 10–15 phút</p></div>
  </a>
  <div class="badge">S02 picker · mobile</div>
</body>
</html>
