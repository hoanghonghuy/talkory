<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Talkory — Kết thúc ôn (S06 summary)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-on-primary: #fff;
      --color-success: #00a35c;
      --color-success-bright: #00ed64;
      --color-success-soft: #c3f0d2;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-card-yellow: #fef7d6;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --shadow-elevated: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--color-surface); color: var(--color-charcoal); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .summary {
      width: 100%; max-width: 100%;
      background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-elevated);
      overflow: hidden;
    }
    .summary-hero {
      background: linear-gradient(180deg, var(--color-success-soft) 0%, var(--color-canvas) 100%);
      padding: 36px 28px 24px; text-align: center;
    }
    .summary-hero h1 { font-size: 28px; font-weight: 600; margin-bottom: 6px; }
    .summary-hero p { font-size: 15px; color: var(--color-slate); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--color-hairline); border-top: 1px solid var(--color-hairline); }
    .stat { background: var(--color-canvas); padding: 20px 12px; text-align: center; }
    .stat strong { display: block; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .stat.good strong { color: var(--color-success); }
    .stat span { font-size: 12px; color: var(--color-slate); }
    .streak-banner {
      margin: 20px 24px; padding: 14px 16px;
      background: var(--color-card-yellow); border: 1px solid #f0e4b8;
      border-radius: var(--radius-lg); font-size: 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .actions { padding: 0 24px 28px; display: flex; flex-direction: column; gap: 8px; }
    .btn { font-family: inherit; font-size: 15px; font-weight: 600; padding: 12px; border-radius: var(--radius-md); border: none; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
    .btn-ghost { background: transparent; color: var(--color-slate); font-weight: 500; }
    .mockup-badge { position: fixed; bottom: 16px; right: 16px; font-size: 11px; color: var(--color-slate); background: #fff; border: 1px solid var(--color-hairline); padding: 6px 12px; border-radius: 999px; }
  </style>
</head>
<body>
  <article class="summary">
    <div class="summary-hero">
      <h1>Session hoàn thành! 🎉</h1>
      <p>Bạn đã ôn 24 thẻ trong ~8 phút</p>
    </div>
    <div class="stats">
      <div class="stat good"><strong>18</strong><span>Good/Easy</span></div>
      <div class="stat"><strong>4</strong><span>Hard</span></div>
      <div class="stat"><strong>2</strong><span>Again</span></div>
    </div>
    <div class="streak-banner">
      <span>🔥</span>
      <span><strong>Streak 5 ngày</strong> — tiếp tục mai nhé!</span>
    </div>
    <div class="actions">
      <a href="S03-dashboard.html" class="btn btn-primary">Về trang chủ</a>
      <a href="S04-curriculum.html" class="btn btn-ghost">Học bài tiếp theo</a>
    </div>
  </article>
  <div class="mockup-badge">S06 · session summary · Mobile</div>
</body>
</html>
