<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Talkory — Lọc deck (S06 mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4; --color-canvas: #fff; --color-surface: #f6f5f4;
      --color-hairline: #e5e3df; --color-charcoal: #37352f; --color-slate: #5d5b54;
      --color-lang-it-accent: #dd5b00; --radius-md: 8px; --radius-lg: 12px;
      --safe-b: env(safe-area-inset-bottom, 0px); --nav-h: 64px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif; background: var(--color-surface);
      padding: 12px 16px calc(var(--nav-h) + var(--safe-b) + 16px);
    }
    .back { font-size: 14px; color: var(--color-slate); text-decoration: none; display: inline-block; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .sub { font-size: 14px; color: var(--color-slate); margin-bottom: 16px; }
    .option {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; background: var(--color-canvas);
      border: 1px solid var(--color-hairline); border-radius: var(--radius-lg);
      margin-bottom: 8px;
    }
    .option.on { border-color: var(--color-primary); background: rgba(86,69,212,0.04); }
    .radio { width: 18px; height: 18px; border: 2px solid var(--color-hairline); border-radius: 999px; flex-shrink: 0; }
    .option.on .radio { border-color: var(--color-primary); box-shadow: inset 0 0 0 4px var(--color-primary); }
    .option strong { display: block; font-size: 15px; }
    .option span { font-size: 12px; color: var(--color-slate); }
    .count { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--color-primary); }
    .btn {
      width: 100%; margin-top: 16px; font: inherit; font-size: 15px; font-weight: 600;
      padding: 12px; background: var(--color-primary); color: #fff;
      border: none; border-radius: var(--radius-md);
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: var(--color-canvas); border-top: 1px solid var(--color-hairline);
      padding: 6px 4px calc(6px + var(--safe-b));
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--color-slate); text-decoration: none; }
    .bottom-nav a.active { color: var(--color-primary); font-weight: 600; }
    .bottom-nav svg { width: 22px; height: 22px; }
    .mock { position: fixed; bottom: calc(var(--nav-h) + 6px); right: 6px; font-size: 9px; padding: 3px 6px; background: #fff; border: 1px solid var(--color-hairline); border-radius: 999px; color: var(--color-slate); }
  </style>
</head>
<body>
  <a href="S06-srs-front.html" class="back">← Quay lại ôn tập</a>
  <h1>Lọc deck</h1>
  <p class="sub">Chọn nguồn thẻ khi ôn SRS</p>
  <div class="option on">
    <div class="radio"></div>
    <div><strong>Tất cả</strong><span>Curriculum + IT</span></div>
    <span class="count">24</span>
  </div>
  <div class="option">
    <div class="radio"></div>
    <div><strong>Curriculum</strong><span>JLPT &amp; HSK</span></div>
    <span class="count">20</span>
  </div>
  <div class="option">
    <div class="radio"></div>
    <div><strong>IT Track</strong><span>Từ vựng công nghệ</span></div>
    <span class="count" style="color:var(--color-lang-it-accent)">4</span>
  </div>
  <button type="button" class="btn">Áp dụng &amp; bắt đầu ôn</button>
        <nav class="bottom-nav" aria-label="Điều hướng chính">
    <a href="S03-dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
      Trang chủ
    </a>
    <a href="S04-curriculum.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Học
    </a>
    <a href="S06-srs-front.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Ôn
    </a>
    <a href="S11-settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      Cài đặt
    </a>
  </nav>
  <div class="mock">S06 settings · mobile</div>
</body>
</html>
