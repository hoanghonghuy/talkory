<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Talkory — AI Tutor (S08 mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-lang-ja: #e6e0f5;
      --color-lang-ja-accent: #7b3ff2;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --nav-h: 64px;
      --input-h: 56px;
      --font-cjk: Inter, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--color-surface);
      min-height: 100dvh;
      display: flex; flex-direction: column;
      padding-bottom: calc(var(--nav-h) + 72px + var(--safe-b));
    }
    .header {
      padding: 12px 16px; background: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
    }
    .header h1 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .mode {
      display: flex; background: var(--color-surface);
      border: 1px solid var(--color-hairline); border-radius: var(--radius-lg); padding: 2px;
    }
    .mode button {
      border: none; background: transparent; font: inherit; font-size: 11px;
      padding: 6px 10px; border-radius: var(--radius-md); color: var(--color-slate);
    }
    .mode button.on { background: var(--color-canvas); color: var(--color-primary); font-weight: 600; }
    .quota {
      font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
      background: var(--color-lang-ja); color: var(--color-lang-ja-accent); white-space: nowrap;
    }
    .chip {
      margin: 8px 16px 0; display: inline-flex; font-size: 11px;
      padding: 5px 10px; background: var(--color-canvas);
      border: 1px solid var(--color-hairline); border-radius: 999px; color: var(--color-slate);
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 88%; padding: 12px 14px; border-radius: var(--radius-xl);
      font-size: 14px; line-height: 1.5;
    }
    .msg.user {
      align-self: flex-end; background: var(--color-primary); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start; background: var(--color-canvas);
      border: 1px solid var(--color-hairline); border-bottom-left-radius: 4px;
    }
    .msg .cjk { font-family: var(--font-cjk); }
    .quick {
      display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 8px;
      -webkit-overflow-scrolling: touch;
    }
    .quick button {
      flex-shrink: 0; font: inherit; font-size: 11px;
      padding: 6px 12px; border: 1px solid var(--color-hairline);
      border-radius: 999px; background: var(--color-canvas); color: var(--color-slate);
    }
    .input-bar {
      position: fixed; left: 0; right: 0; z-index: 40;
      bottom: calc(var(--nav-h) + var(--safe-b));
      padding: 10px 16px;
      background: var(--color-canvas); border-top: 1px solid var(--color-hairline);
      display: flex; gap: 8px; align-items: flex-end;
    }
    .input-bar textarea {
      flex: 1; font: inherit; font-size: 16px; padding: 10px 12px;
      border: 1px solid var(--color-hairline); border-radius: var(--radius-lg);
      resize: none; min-height: 44px; max-height: 100px;
    }
    .send {
      width: 44px; height: 44px; border: none; border-radius: var(--radius-md);
      background: var(--color-primary); color: #fff; flex-shrink: 0;
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: var(--color-canvas); border-top: 1px solid var(--color-hairline);
      padding: 6px 4px calc(6px + var(--safe-b));
      display: grid; grid-template-columns: repeat(5, 1fr);
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; color: var(--color-slate); text-decoration: none;
    }
    .bottom-nav svg { width: 22px; height: 22px; }
    .mock { position: fixed; top: 8px; right: 8px; font-size: 9px; padding: 3px 6px; background: #fff; border: 1px solid var(--color-hairline); border-radius: 999px; }
  </style>
</head>
<body>
  <header class="header">
    <h1>AI Tutor</h1>
    <div class="row">
      <div class="mode">
        <button type="button">Tự do</button>
        <button type="button" class="on">Theo bài</button>
      </div>
      <span class="quota">3/5 lượt</span>
    </div>
  </header>
  <span class="chip">📎 Bài 3 — Hiragana か</span>
  <div class="messages">
    <div class="msg user">Giải thích khác nhau き và さ?</div>
    <div class="msg bot">
      <span class="cjk">き</span> (ki) thuộc hàng か; <span class="cjk">さ</span> (sa) thuộc hàng さ — âm /k/ vs /s/.
    </div>
    <div class="msg user">Cho 2 ví dụ từ N5 dùng き.</div>
  </div>
  <div class="quick">
    <button type="button">Giải thích</button>
    <button type="button">Sửa câu</button>
    <button type="button">Tạo bài tập</button>
    <button type="button">Dịch VI</button>
  </div>
  <div class="input-bar">
    <textarea rows="1" placeholder="Hỏi AI…"></textarea>
    <button type="button" class="send">➤</button>
  </div>
  <nav class="bottom-nav">

    <a href="S04-curriculum.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Học</a>
    <a href="S06-srs.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/></svg>Ôn</a>
    <a href="S09-it-track.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>IT</a>
    <a href="S11-settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Cài đặt</a>
  </nav>
  <div class="mock">S08 · mobile</div>
</body>
</html>
