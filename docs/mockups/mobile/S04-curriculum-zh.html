<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Talkory — Lộ trình (S04 mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #5645d4;
      --color-success: #00a35c;
      --color-success-bright: #00ed64;
      --color-success-soft: #c3f0d2;
      --color-canvas: #fff;
      --color-surface: #f6f5f4;
      --color-surface-soft: #fafaf9;
      --color-hairline: #e5e3df;
      --color-charcoal: #37352f;
      --color-slate: #5d5b54;
      --color-muted: #bbb8b1;
      --color-lang-ja: #e6e0f5;
      --color-lang-ja-accent: #7b3ff2;
      --color-lang-zh-accent: #2a9d99;
      --color-card-mint: #d9f3e1;
      --color-card-yellow: #fef7d6;
      --radius-md: 8px;
      --radius-lg: 12px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --nav-h: 64px;
      --font-cjk: Inter, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--color-surface);
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
    }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
      padding: 12px 16px;
    }
    .topbar h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    .lang-tabs {
      display: flex; background: var(--color-surface);
      border: 1px solid var(--color-hairline); border-radius: var(--radius-lg);
      padding: 3px;
    }
    .lang-tabs button {
      flex: 1; border: none; background: transparent;
      font: inherit; font-size: 13px; font-weight: 500;
      padding: 8px; border-radius: var(--radius-md); color: var(--color-slate);
    }
    .lang-tabs button.on {
      background: var(--color-lang-ja); color: var(--color-lang-ja-accent);
      font-weight: 600;
    }
    main { padding: 16px; }
    .mascot-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg); padding: 10px 12px; margin-bottom: 16px;
    }
    .mascot-row img { height: 44px; }
    .mascot-row strong { font-size: 13px; color: var(--color-lang-ja-accent); display: block; }
    .mascot-row span { font-size: 12px; color: var(--color-slate); }
    .level {
      background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden;
    }
    .level-head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; cursor: pointer;
    }
    .badge-n5 {
      width: 44px; height: 44px; border-radius: var(--radius-md);
      background: var(--color-card-mint); color: var(--color-success);
      font-weight: 700; font-size: 14px;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .level-head h3 { font-size: 15px; font-weight: 600; }
    .level-head p { font-size: 12px; color: var(--color-slate); }
    .tag-free {
      font-size: 10px; font-weight: 600; padding: 2px 6px;
      border-radius: 999px; background: var(--color-success-soft);
      color: var(--color-success); margin-left: 6px;
    }
    .lessons {
      border-top: 1px solid var(--color-hairline);
      background: var(--color-surface-soft);
      padding: 8px;
    }
    .lesson {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; border-radius: var(--radius-md);
      background: var(--color-canvas); margin-bottom: 4px;
      text-decoration: none; color: inherit;
    }
    .lesson.hl { border: 1px solid rgba(86,69,212,0.3); background: rgba(86,69,212,0.04); }
    .lesson-icon {
      width: 32px; height: 32px; border-radius: var(--radius-md);
      background: var(--color-surface); font-family: var(--font-cjk);
      display: grid; place-items: center; font-size: 15px;
    }
    .lesson strong { display: block; font-size: 14px; font-weight: 500; }
    .lesson small { font-size: 11px; color: var(--color-slate); }
    .tag-next {
      margin-left: auto; font-size: 10px; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
      background: var(--color-card-yellow); color: #92680a; flex-shrink: 0;
    }
    .level.collapsed .lessons { display: none; }
    .level.collapsed .level-head { opacity: 0.7; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: var(--color-canvas); border-top: 1px solid var(--color-hairline);
      padding: 6px 4px calc(6px + var(--safe-b));
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; color: var(--color-slate); text-decoration: none;
    }
    .bottom-nav a.active { color: var(--color-primary); font-weight: 600; }
    .bottom-nav svg { width: 22px; height: 22px; }
    .mock { position: fixed; bottom: calc(var(--nav-h) + 6px); right: 6px; font-size: 9px; padding: 3px 6px; background: #fff; border: 1px solid var(--color-hairline); border-radius: 999px; color: var(--color-slate); }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Lộ trình HSK</h1>
    <div class="lang-tabs">
      <button type="button" class="on">🇨🇳 Trung</button>
      <button type="button" class="on">🇨🇳 Trung</button>
    </div>
  </header>
  <main>

      <div><strong>Longmi</strong><span>Đồng hành học Trung</span></div>
    </div>
    <article class="level">
      <div class="level-head">
        <div class="badge-n5">HSK1</div>
        <div>
          <h3>HSK1 <span class="tag-free">Miễn phí</span></h3>
          <p>12 bài · 25% hoàn thành</p>
        </div>
      </div>
      <div class="lessons">
        <a href="S05-lesson.html" class="lesson hl">
          <div class="lesson-icon">你</div>
          <div><strong>Bài 3 — Chào hỏi</strong><small>15 phút</small></div>
          <span class="tag-next">Tiếp</span>
        </a>
        <div class="lesson">
          <div class="lesson-icon">✓</div>
          <div><strong>Bài 2 — Số đếm</strong><small>Đã xong</small></div>
        </div>
      </div>
    </article>
    <article class="level collapsed">
      <div class="level-head">
        <div class="badge-n5" style="background:var(--color-lang-ja);color:var(--color-lang-zh-accent)">HSK2</div>
        <div><h3>HSK2</h3><p>19 bài · 🔒 Premium</p></div>
      </div>
    </article>
  </main>
